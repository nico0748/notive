name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  notescore:
    name: NotesCore (build & test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Build & test NotesCore package
        working-directory: Packages/NotesCore
        run: |
          set -o pipefail
          if ! swift test --enable-code-coverage 2>&1 | tee /tmp/notescore.log; then
            {
              echo '## NotesCore build/test output (tail)'
              echo '```'
              tail -n 200 /tmp/notescore.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint (strict)
        run: swiftlint lint --strict

  app:
    name: macOS app (build)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          set -o pipefail
          if ! xcodegen generate 2>&1 | tee /tmp/xcodegen.log; then
            {
              echo '## xcodegen output'
              echo '```'
              cat /tmp/xcodegen.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build macOS app
        run: |
          set -o pipefail
          if ! xcodebuild build \
            -project Notive.xcodeproj \
            -scheme Notive-macOS \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild.log; then
            {
              echo '## xcodebuild output (tail)'
              echo '```'
              tail -n 250 /tmp/xcodebuild.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
