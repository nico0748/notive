name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  notescore:
    name: NotesCore (build & test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Build & test NotesCore package
        working-directory: Packages/NotesCore
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          if ! swift test --enable-code-coverage 2>&1 | tee /tmp/notescore.log; then
            if [ -n "$PR_NUMBER" ]; then
              {
                echo '<!-- ci-diagnostic -->'
                echo '### CI diagnostic — NotesCore (build & test)'
                echo '```'
                tail -n 200 /tmp/notescore.log
                echo '```'
              } > /tmp/comment.md
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/comment.md || true
            fi
            exit 1
          fi

  lint:
    name: SwiftLint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint (strict)
        run: swiftlint lint --strict

  app:
    name: macOS app (build)
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          set -o pipefail
          if ! xcodegen generate 2>&1 | tee /tmp/xcodegen.log; then
            if [ -n "$PR_NUMBER" ]; then
              {
                echo '<!-- ci-diagnostic -->'
                echo '### CI diagnostic — xcodegen generate'
                echo '```'
                cat /tmp/xcodegen.log
                echo '```'
              } > /tmp/comment.md
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/comment.md || true
            fi
            exit 1
          fi

      - name: Build macOS app
        run: |
          set -o pipefail
          if ! xcodebuild build \
            -project Notive.xcodeproj \
            -scheme Notive-macOS \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/xcodebuild.log; then
            if [ -n "$PR_NUMBER" ]; then
              {
                echo '<!-- ci-diagnostic -->'
                echo '### CI diagnostic — xcodebuild (tail)'
                echo '```'
                grep -E 'error:|warning:|note:|Compiling|Linking|** BUILD' /tmp/xcodebuild.log | tail -n 120 || tail -n 120 /tmp/xcodebuild.log
                echo '```'
              } > /tmp/comment.md
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/comment.md || true
            fi
            exit 1
          fi
